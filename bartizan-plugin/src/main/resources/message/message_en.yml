# message_en.yml - Bartizan's message catalogue (bartizan.md §1.5).
# Started at 18 entries: 4 prefixes + 14 content members - exactly what BartizanMessages read at gate HA.
# Gate HD added Errors.Player_Not_Found and Commands.Weapon.Gave for /bartizan weapon give <player> <weapon>.

Normal:
   Prefix: "&8&l[&7B&fT&7Z&8&l]&7 "

Commands:
   Prefix: "&6BTZ &8&l>>&7 "
   Syntax:
      Missing_Arguments: "&4Missing Arguments&7: "
   Weapon:
      Received: "You received &8(&7%amount%&8) &e%weapon% &7weapon."
      Gave: "&7Gave &8(&7%amount%&8) &e%weapon% &7to &b%player%&7."
      List_Header: "List of weapons"
      Skin_Applied: "&7Applied skin &b%skin% &7to your held weapon."
   Ammo:
      Received: "You received &8(&7%amount%&8) &e%ammo% &7ammunition."
      List_Header: "List of ammunition"
   Wearable:
      Gave: "Gave &b%name% &7x&b%amount%&7."
      List_Header: "List of wearables"
   Import:
      Done: "&7Imported &b%weapons%&7 weapon(s) from WeaponMechanics: &b%mapped%&7 mapped, &e%approximated%&7 approximated, &c%dropped%&7 dropped. Report saved to &3%report%&7."

Errors:
   Prefix: "&4Error&7: "
   Must_Be_Numbers: "&a%command% &7must be numbers."
   Player_Not_Found: "&cPlayer not found: &3%player%&c."
   Not_Valid_Weapon: "&cInvalid weapon type &3%args%&c."
   Not_Valid_Ammo: "&cInvalid ammunition type &3%args%&c."
   No_Stats: "&cNo stats recorded for &3%player%&c."
   Not_Valid_Skin: "&cUnknown skin &3%skin% &cfor this weapon."
   Wearable:
      Invalid: "Invalid wearable: &c%name%"
      Not_Registered: "Wearable not registered: &c%key%"
      Not_Wearable: "Not a registered wearable!"
      Equip_Denied: "&cYou are not authorized to equip this armor."
   Import:
      Not_Found: "&cWeaponMechanics folder not found at &3%path%&c."

Information:
   Prefix: "&8&l[&7Information&8&l]&7 "

Death:
   Weapon:
      - "%killer% killed %victim% vigorously using %item%."
      - "%victim% was killed by %killer% using %item%."
