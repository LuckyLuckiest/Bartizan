# settings.yml - Bartizan's runtime configuration (bartizan.md §1.8). Carries only the settings the weapon module
# actually reads. Bartizan keeps no database: a weapon item's identity and state live in its own NBT.

Language: "en"

Debug:
   Enable: false

Money_Symbol: "$"

Block_Regeneration:
   Restore_Delay_Ticks: 100
   Regeneration_Delay_Ticks: 100
   Regeneration_Step_Ticks: 4

# Default_Effects: fallback feedback used when a weapon's own Effects: section declares no list for a given hook.
# A weapon's own list REPLACES the default for that hook entirely - never merged. Same hook -> effect-list shape
# as a weapon's own Effects: section (weapons-roadmap.md gate HA, §1).
#
# Hooks (v1): On_Shoot, On_Hit, On_Block_Hit (a hitscan ray striking a block - no damage, fired alongside the
# hardcoded block-crack impact particle), On_Headshot, On_Critical, On_Kill, On_Miss, On_Empty, On_Deny, On_Equip,
# On_Holster, On_Reload_Start, On_Reload_End, On_Reload_Cancel, On_Scope_In, On_Scope_Out, On_Explode,
# On_Charge_Level, On_Charge_Full, On_Beam_Fire (reserved - fired by later gates), On_Status_Apply (reserved -
# fired by later gates), On_Status_Expire (reserved - fired by later gates). An unknown hook name is a warning,
# not an error - the rest of the file still loads.
#
# Every effect type below also accepts Target (source|victim|nearby) and Radius (blocks, required for
# Target: nearby) even where not listed per-type.
#
# Effect types and keys (Type is required on every entry; an unknown/missing Type is a warning and that entry is
# skipped):
#   Sound         - Sound, Volume (1.0), Pitch (1.0), Pitch_Per_Level (0, added to Pitch once per ctx level - used
#                   by On_Charge_Level's lowered Charge_Feedback), Target (source|victim|nearby), At (source|
#                   muzzle|impact|victim, optional). With At set, the sound broadcasts once at that location;
#                   without it, it plays privately to each player resolved from Target (non-players are skipped)
#   Custom_Sound  - same keys as Sound, but Sound names a resource-pack key instead of a vanilla one
#   Particle      - Particle, Count (1), Offset ("0 0 0", three space-separated doubles), Speed (0), At,
#                   Color (#RRGGBB, only read for the DUST particle)
#   Potion        - Potion, Duration (ticks), Amplifier (0), Target (victim)
#   Action_Bar    - Text, Target (source) - player-only
#   Title         - Title, Subtitle, Fade_In (10), Stay (70), Fade_Out (20), Target (source) - player-only
#   Boss_Bar      - Text, Color (WHITE), Style (SOLID), Duration (ticks, 60), Target (source) - player-only
#   Message       - Text, Target (source) - player-only
#   Command       - Command, As (console|player, console), Target (source); %player%/%victim% substituted
#   Push          - Strength (1.0), Direction (look|away, look), Target (source)
#   Camera_Shake  - Yaw, Pitch, Target (source) - player-only
#   Ignite        - Ticks (60), Target (victim)
#   Cooldown      - Ticks, Target (source) - player-only, shows the vanilla item-cooldown overlay
#   Firework      - Power (0), Color (#RRGGBB), Firework_Type (BALL), At (impact) - spawns and instantly detonates
#   Lightning     - At (impact) - visual/sound strike only, deals no damage
#
# Placeholders available in Text/Title/Subtitle: %player% %victim% %weapon% %damage% %distance% %level%
# %ammo_left% %ammo_max% %deny_reason%. Command substitutes only %player%/%victim% (see Command's own line above).
#
# Removing this whole Default_Effects section restores the built-in defaults below (BartizanSettings logs one
# warning when it does) - a present-but-empty section switches defaults off entirely instead.
Default_Effects:
   # Muzzle flash: every shipped gun lowers its Shoot.Sound.* into a two-entry On_Shoot list (the shot sound plus
   # this same flash, appended by EffectsSectionParser.lowerLegacySounds), which replaces this section entirely
   # rather than merging with it - so this copy is a fallback for a future weapon/category with no shot sound and
   # no Effects.On_Shoot list configured, not a no-op.
   On_Shoot:
      - Type: Particle
        Particle: SMOKE_NORMAL
        Count: 6
        Offset: "0.05 0.05 0.05"
        Speed: 0.02
        At: muzzle
   On_Critical:
      - Type: Sound
        Sound: ITEM_SHIELD_BREAK
        Volume: 1.0
        Pitch: 1.0
        Target: source
   On_Deny:
      - Type: Action_Bar
        Text: "&c%deny_reason%"
        Target: source
   On_Explode:
      - Type: Sound
        Sound: ENTITY_GENERIC_EXPLODE
        Volume: 2.0
        Pitch: 1.0
        At: impact
