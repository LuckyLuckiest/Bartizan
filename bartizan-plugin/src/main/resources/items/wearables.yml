   Set: hazmat

# Sets: is a top-level sibling of the wearable entries above, not nested inside one - see the header comment.
Sets:
   hazmat:
      Pieces_2:
         Traits:
            SEALED: 1
      Pieces_4:
         Traits:
            SEALED: 2
            FIRE_RESISTANT: 1
         Effects_While_Worn:
            # A large placeholder duration, not a negative "permanent" sentinel - the worn-effects ticker ignores
            # and replaces the configured duration anyway (see the header comment above). To instead SKIP a
            # token entirely (e.g. to have this tier cancel a piece's own worn effect), give it a raw amplifier
            # of exactly -1, e.g. "REGENERATION-9999--1" (not used here - REGENERATION is actually granted).
            - "REGENERATION-9999-1"