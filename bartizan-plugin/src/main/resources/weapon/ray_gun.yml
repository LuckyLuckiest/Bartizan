# +-----------------+ #
# |     Ray Gun     | #
# +-----------------+ #

Information:
   Name: "&dRay Gun&r"
   Category: beam
   Material: RECOVERY_COMPASS
   Durability:
      Base: 100
      Change:
         On_Shot: 0
   Lore:
      - "&dExperimental energy weapon.&r"
      - "&7Hold right-click to charge.&r"
      - "&7Release to unleash radiation.&r"
   Drop_Hologram: false

Shoot:
   Selective_Fire: single
   Allowed_Modes:
      - single
   # Legacy Shoot.Charge aliases (weapons-roadmap.md gate HB) - equivalent to the Shoot.Charge block arc_lance.yml
   # uses. Left as-is since both forms parse identically.
   Charge_Time_Per_Level: 15
   Max_Charge_Level: 3
   Beam:
      Mode: burst
      Range: 35.0
      Width: 0.5
      Ammo_Per_Level: 1
      Pierce:
         Entities: -1
         Blocks: 0
         Damage_Multiplier_Per_Target: 0.85
      Damage:
         # Lower than the Arc Lance - the ray gun trades raw damage for its radiation flavour/lore.
         Base: 3.0
         Per_Level: 3.0
         Head: 2.0
         Knockback: 0.4
         Fire_Ticks: 0
      Preview:
         Particle: END_ROD
         Length_Per_Level: 1.5
         Interval: 2
         Guide_Line: false
      Render:
         Core_Particle: DUST
         Core_Color: "#7CFC00"
         Glow_Particle: END_ROD
         Thickness: 0.25
         Step: 0.25
         Duration: 8
      Impact:
         Particle: FLASH
         Sound: ENTITY_ELDER_GUARDIAN_CURSE
         Scorch_Blocks: false
   Recoil:
      Amount: 0.0
      Push: 0.06
      Power_Up: 0.0
      Pattern: []
   Sound:
      Default_Sound:
         Sound: ENTITY_ELDER_GUARDIAN_CURSE
         Volume: 0.7
         Pitch: 1.5
      Empty_Default_Sound:
         Sound: BLOCK_BEACON_DEACTIVATE
         Volume: 0.6
         Pitch: 1.5

Ammunition:
   Ammo_Type: pathogen_vial
   Capacity: 5
   Consume: 1
   Restore: 5

Reload:
   Cooldown: 4
   Type: instant
   Sound:
      Default_Sound_Before:
         Sound: BLOCK_BEACON_POWER_SELECT
         Volume: 0.8
         Pitch: 1.2
      Default_Sound_After:
         Sound: BLOCK_BEACON_ACTIVATE
         Volume: 0.6
         Pitch: 1.2
   Action_Bar:
      Reloading: "&dRecharging core...&r"
      Opening: "&dOpening...&r"

Scope:
   Level: 1

Modifiers:
   Flat_Damage: 0.0

Death_Messages:
   - "&c%victim% was irradiated by %killer%'s %item%."
   - "&c%killer% disintegrated %victim% with the ray gun."
   - "&c%victim% glowed brightly thanks to %killer%."
