# +-----------------+ #
# | Rocket Launcher | #
# +-----------------+ #

Information:
   Name: "&cRocket Launcher&r"
   Category: gun
   Material: NETHERITE_AXE
   Durability:
      Base: 100
      Change:
         On_Shot: 0
   Lore:
      - "&7Shoulder-fired guided rocket.&r"
      - "&7Perfect for crowds. And cars.&r"
   Drop_Hologram: true

Shoot:
   Selective_Fire: single
   Allowed_Modes:
      - single

   Projectile:
      Speed: 3
      Type: ROCKET
      Damage:
         Base: 30
         Explosion_Damage: 50
         Explosion_Radius: 4.0
         Fire_Ticks: 40
         Head: 0
         Critical_Hit:
            Chance: 0
            Amount: 0
         # Owner_Immunity: keeps the shooter safe from their own rocket blast. Explicit here since the
         # default is false (grenades self-damage by default; this rocket opts out of that).
         Owner_Immunity: true
      Explosion:
         # Radius/Damage/Fire_Ticks/Owner_Immunity/Ignore_Teams/Knockback fall back to the legacy Damage: keys
         # above when omitted here - this block only opts into the new shape/exposure/cluster/airstrike/
         # detonation controls (gate HI-a).
         Shape: sphere
         Exposure: distance
         Block_Damage: false
         # Airstrike:
         #    Count: 3
         #    Height: 15
         #    Radius: 6
         #    Delay_Ticks: 20
         # Detonation:
         #    Delay_After_Impact: 10   # freeze the rocket at impact for 10 ticks before it actually goes off
      Consumed_Amount: 1
      Per_Shot: 1
      Cooldown: 10
      Distance: 80
      # [Visual] the cosmetic entity the stepped-flight task drives every tick. Type: fireball is also the
      # default for ROCKET when Visual: is left out entirely — spelled out here for clarity.
      Visual:
         Type: fireball
      # [Drag] fractional per-tick speed loss applied after Gravity — 0.0 (default) means the rocket never
      # slows down in flight.
      Drag: 0.0
      # [Particle] draws the weapon's Modifiers.Tracer (or a default gray dust line when none is configured)
      # along each tick's travelled segment, so the rocket leaves a visible trail behind it.
      Particle: true
      # [Bouncy] uncomment to let the rocket survive a block hit instead of exploding on first contact.
      # Default is the multiplier used for any block not listed below (0.0 = no bounce); every other key is a
      # material or block-group name (see BlockGroupResolver) with its own multiplier.
      # Bouncy:
      #    Default: 0.0
      #    GLASS: 0.4
      # [Extinguish_In_Water] uncomment so the rocket fizzles out (no explosion) the instant it touches water,
      # instead of continuing to fly through it.
      # Extinguish_In_Water: true
      # [Alive_Ticks] uncomment to override the flight's lifetime — otherwise it's computed from Speed/Distance.
      # Alive_Ticks: 200
      # [Trail] uncomment to spawn an extra particle at the rocket's position every tick, on top of the
      # Particle: tracer line above.
      # Trail: SMOKE_LARGE

   Weapon_Consumed:
      Consume_On_Shot: 0
      Time: -1

   Spread:
      Starting_Spread: 0.0
      Time: 1
      Change:
         Base: 0.0
         Bounds:
            Reset_On_Bound: true
            Min: 0.0
            Max: 0.0

   Recoil:
      Amount: 0.3
      Push: 0.25
      Power_Up: 0.001
      Pattern:
         - 6;0
         - 0;0

   Sound:
      Default_Sound:
         Sound: ENTITY_FIREWORK_ROCKET_LAUNCH
         Volume: 1.5
         Pitch: 0.7
      Empty_Default_Sound:
         Sound: BLOCK_NOTE_BLOCK_HAT
         Volume: 1.0
         Pitch: 0.6
      Flyby_Range: 4.0
      Flyby_Default_Sound:
         Sound: ENTITY_FIREWORK_ROCKET_BLAST
         Volume: 1.0
         Pitch: 1.0
      Impact_Default_Sound:
         Sound: ENTITY_GENERIC_EXPLODE
         Volume: 1.5
         Pitch: 1.0

Ammunition:
   Capacity: 6
   Ammo_Type: rocket
   Consume: 1
   Restore: 2

Reload:
   Cooldown: 2

   Sound:
      Default_Sound_Before:
         Sound: BLOCK_IRON_TRAPDOOR_OPEN
         Volume: 1.0
         Pitch: 0.7
      Default_Sound_After:
         Sound: BLOCK_IRON_TRAPDOOR_CLOSE
         Volume: 1.0
         Pitch: 0.7

   Action_Bar:
      Reloading: "&cLoading rocket...&r"
      Opening: "&cOpening...&r"

   Type: num-2

Scope:
   Level: 1

Modifiers:
   Flat_Damage: 0.0
   Armor_Piercing: 1.0

Death_Messages:
   - "&c%victim% was obliterated by %killer%'s %item%."
   - "&c%killer% sent %victim% to orbit."
   - "&c%victim% caught a rocket from %killer%."
