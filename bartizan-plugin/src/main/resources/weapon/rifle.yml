# |      Rifle      | #
# +-----------------+ #

# All the information of the weapon
Information:
   # The displayed name of the weapon
   Name: "&7M4 Carbine&r"
   # The category of the weapon:
   # gun, melee, projectile, incendiary
   Category: gun
   # The material that would be used for the weapon
   Material: IRON_PICKAXE
   # The Default-state model when Skins.Default (below) is absent. Matches Skins.Default here on purpose -
   # nothing about how the weapon looks changes by adding the Skins: block.
   Custom_Model_Data: 1000
   # 1.21.2+ item model component (a namespaced key, e.g. a resource pack's custom model). Ignored (with a
   # startup warning) on an older server - Custom_Model_Data above still applies there either way. Uncomment
   # once a matching resource pack model exists.
   # Item_Model: "bartizan:rifle"
   # For mc versions 1.9> setting durability can have unique textures
   Durability:
      Base: 100
      Change:
         On_Shot: 0
   # The item lore
   Lore:
      - "&7The M4 Carbine is a 5.56×45mm NATO, air-cooled, gas-operated,&r"
      - "&7direct impingement, magazine-fed, select fire carbine.&r"
   # The weapon would display its information when dropped
   Drop_Hologram: true

# Shoot configuration
Shoot:
   # Which click fires the weapon; the other toggles scope. right_click is the default (shown here for
   # documentation) — GUN weapons only. left_click swaps them: LMB fires, RMB scopes.
   Trigger: right_click
   # Circumstance rules: deny blocks firing while the circumstance is active, required blocks firing while it
   # is NOT active. Sprinting is realistic for a rifle you're supposed to aim, not run-and-gun with. Every key
   # below is independent and optional — shown here for documentation, only Sprinting is actually configured.
   Circumstance:
      Sprinting: deny
      # Sneaking: deny
      # Swimming: deny
      # In_Midair: deny
      # Reloading: deny
      # Zooming: required
      # Ammo_Empty: deny

   # The type of fire when using the weapon
   # SINGLE, BURST, AUTO
   Selective_Fire: auto
   # Restricts which fire modes the player can cycle through with Shift+F.
   # If omitted, the weapon is locked to the configured Selective_Fire mode.
   Allowed_Modes:
      - single
      - burst
      - auto

   # Projectile configuration
   Projectile:
      # The speed of the projectile
      Speed: 4
      # There are 4 types of projectiles:
      # BULLET, FLARE, ROCKET, SPREAD
      Type: BULLET

      # The projectile damage on impact
      Damage:
         # The base value
         Base: 7
         # Weapon explosion damage
         Explosion_Damage: 0
         # The time the player would be on fire (ticks = 20 ~ 1 second)
         Fire_Ticks: 0
         # Head bonus damage
         Head: 5
         # Critical Hit damage
         Critical_Hit:
            # The change in %
            Chance: 2
            # Bonus amount
            Amount: 4

      # The number of projectiles consumed
      Consumed_Amount: 1
      # The number of projectiles shot
      Per_Shot: 1
      # The cooldown of the bullet before shooting another one
      Cooldown: 0.5
      # The maximum travel distance of the projectile
      Distance: 10
      # A particle trail of the projectile
      Particle: true
      # Gravitational drop beyond effective range — higher = heavier drop, 0 = no drop.
      # Drop formula: 0.5 * gravity * (distance_beyond_range / speed)^2
      Gravity: 0.1

   # The weapon consumption
   Weapon_Consumed:
      # Consume the weapon on which shot
      Consume_On_Shot: 0
      # The time after the first shot to consume the weapon
      Time: -1

   # The spread of the projectile
   Spread:
      # The initial spread value
      Starting_Spread: 0.05
      # The time before the spread value is reset
      Time: 5
      # The change of the spread after time
      Change:
         # The base value for spread value
         Base: 0.05
         # The bounds that would be incremented
         Bounds:
            # Reset to the starting spread when on bound
            Reset_On_Bound: true
            # The minimum value for the random value
            Min: 0.05
            # The maximum value for the random value
            Max: 1.5

      # Percent deltas applied to the current spread while the given condition holds (summed, then clamped at 0)
      # - e.g. Zooming: -40 tightens spread 40% while scoped, In_Midair: 100 doubles it while airborne. All keys
      # optional, default 0 (no effect).
      Modify_Spread_When:
         Zooming: -40
         Sprinting: 60
         In_Midair: 100

   # The screen shake of the player
   Recoil:
      # The recoil effect of the player screen
      Amount: 0.05
      # Push velocity upon shots
      Push: 0.05
      # Power up which affects the y-axis
      Power_Up: 0.0002
      # The pattern that would be used for recoil, and at the end it would reset to the first value
      Pattern:
         - 2.5;1
         - 0;0
         - 0.5;1
         - 1;1
      # Random: gaussian recoil instead of a fixed Pattern step - Mean_X/Mean_Y center the yaw/pitch kick,
      # Variance_X/Variance_Y are used directly as the gaussian standard deviation (sigma), not squared/rooted,
      # despite the name. Configuring both Random and Pattern is a warning; Random wins.
      # Uncomment to use gaussian recoil instead of the Pattern above.
      # Random:
      #    Mean_X: 2.0
      #    Mean_Y: 1.0
      #    Variance_X: 1.5
      #    Variance_Y: 0.5

   Sound:
      # The default sound that would be used when there is no custom sound available
      Default_Sound:
         Sound: ENTITY_GENERIC_EXPLODE
         Volume: 1.3
         Pitch: 2.2
      # Overrides the default shoot sound if available
      Custom_Sound:
         Sound: sound.gta.bullet_generic_shoot
         Volume: 1.4
         Pitch: 1.2
      # When the weapon magazine is empty, it would use the sound set
      Empty_Default_Sound:
         Sound: ENTITY_BLAZE_BURN
         Volume: 1
         Pitch: 1
      # Overrides the default empty sound if available
      Empty_Custom_Sound:
         Sound: sound.gta.empty_mag1
         Volume: 1.2
         Pitch: 1
      # How close (in blocks) a bullet must pass for the flyby whoosh to play
      Flyby_Range: 3.0
      # Flyby sound heard by players the bullet passes near
      Flyby_Default_Sound:
         Sound: ENTITY_ARROW_SHOOT
         Volume: 0.6
         Pitch: 2.0
      # Overrides the default flyby sound if available
      Flyby_Custom_Sound:
         Sound: sound.gta.bullet_fly_by
         Volume: 0.8
         Pitch: 1.0
      # Impact sound when the bullet strikes a target
      Impact_Default_Sound:
         Sound: BLOCK_STONE_HIT
         Volume: 1.0
         Pitch: 1.5
      # Overrides the default impact sound if available
      Impact_Custom_Sound:
         Sound: sound.gta.bullet_fly_by
         Volume: 1.0
         Pitch: 1.0

   # Where the tracer/particle visuals and any slow-projectile (ROCKET/FLARE) spawn from - the hitscan ray itself
   # always starts at the shooter's eye. Each value is a "right up forward" triple in blocks; Scope is used while
   # scoped, else Left_Hand/Right_Hand by the player's main hand. Values below match the plugin's hardcoded
   # defaults, so this whole section is a no-op unless changed.
   Muzzle_Offset:
      Right_Hand: "0.3 -0.2 0"
      Left_Hand: "-0.3 -0.2 0"
      Scope: "0.3 -0.2 0"

# Ammunition configuration
Ammunition:
   # The default magazine holding capacity
   Capacity: 45
   # The ammo name from the ammunition YAML file
   Ammo_Type: "5,56"
   # The number of ammunition items that is required to insert one magazine
   Consume: 1
   # The amount that would be restored in the magazine
   Restore: 45

# Weapon reload configuration
Reload:
   # The reload time taken, in seconds (each second is one step of the reload timer; the HUD boss bar and the
   # Reload_Item_Cooldown overlay run for exactly this long, plus one second for a numbered reload)
   Cooldown: 4

   Sound:
      # Default sounds only use mc supported sounds, and they can be overlapped with custom sounds
      Default_Sound_Before:
         Sound: ENTITY_WITHER_DEATH
         Volume: 1
         Pitch: 1
      Default_Sound_After:
         Sound: ENTITY_WITHER_DEATH
         Volume: 1
         Pitch: 1
      # The custom sound played when reloading a gun
      Custom_Sound:
         Start:
            Sound: sound.gta.m4_reload_start
            Volume: 1
            Pitch: 1
         Mid:
            Sound: sound.gta.m4_reload_mid
            Volume: 1
            Pitch: 1
         End:
            Sound: sound.gta.m4_reload_end
            Volume: 1
            Pitch: 1

   # Reloading action bar information
   Action_Bar:
      # Shows when the player is currently reloading the weapon
      Reloading: "&cReloading...&r"
      # Shows before the weapon reloads
      Opening: "&cOpening...&r"

   # There are 3 types of reloads:
   # 1) instant - treats the reload as a magazine to reload weapon
   # 2) one - dynamically places ammunition in increments of one
   # 3) num - this requires two arguments separated by '-' to specify the amount of ammunition that is required to
   #          dynamically insert in the weapon. This would work similarly to type one.
   Type: instant

   # Stages: splits an instant reload's Cooldown above into three timed steps and lets an interrupted reload
   # (weapon-swapped mid-reload) pick back up instead of restarting - optional, absent entirely uses the defaults
   # commented below. A numbered reload (Type: one / num-N) ignores Open/Insert/Close.Share - its stages are one
   # insert per shell instead, derived from the shell count at reload time.
   # Stages:
   #    # How many ticks after an interrupt a reload may still resume from where it left off, instead of starting
   #    # over. 0 (or negative) = always restart from zero, the pre-staged-reload behaviour. Default: 60.
   #    Resume_Window: 60
   #    # Open/Insert/Close.Share split Cooldown into open (start -> the mid sound), insert (mid sound -> the
   #    # magazine is actually consumed - the commit point) and close (the final wait before the reload
   #    # completes). Shares are normalised, so they don't need to sum to 1 - three 1's split the same as
   #    # 0.25/0.6/0.15 below. Non-positive shares fall back to these defaults instead of dividing by zero.
   #    Open:
   #       Share: 0.25
   #    Insert:
   #       Share: 0.6
   #    Close:
   #       Share: 0.15

# Weapon scope configuration
Scope:
   # Sets the scope level. The resulting SLOWNESS amplifier is capped at 5 regardless of Level/Zoom_Stacking -
   # WeaponMechanics' Zoom_Amount scale goes to 10, but vanilla SLOWNESS 6+ can freeze the player outright.
   Level: 2
   # Zoom_Amount is a WeaponMechanics-style alias for Level, for files ported from there. Ignored here since
   # Level above is already set (configuring both is a warning; Level always wins).
   # Zoom_Amount: 2

   Sound:
      # The default sound that would be used if the custom sound was not found
      Default_Sound:
         Sound: ENTITY_GENERIC_EXPLODE
         Volume: 1
         Pitch: 3
      # The custom sound played when using scope
      Custom_Sound:
         Sound: sound.gta.m4_scope
         Volume: 1
         Pitch: 1

# The modifiers of the projectiles/weapon that would be applied on hit
Modifiers:
   # Flat damage - adds additional damage after wearable reduction
   Flat_Damage: 0.0
   # Format: MATERIAL_OR_GROUP-HITS_REQUIRED[-MODE]
   # Modes: RESTORE (break + regen, default), CRACK_ONLY (never break, regen from max crack), DESTROY (break, no regen)
   Break_Blocks:
      - GLASS-3
      - ICE-5
      - TERRACOTTA-10

   # Penetration - blocksThrough-entitiesThrough-damageReductionPerPenetration
   Penetration: 2-3-0.25
   # Pierce_Entities: sugar for an entities-only Penetration (equivalent to Penetration: 0-<n>-0) when you don't
   # need block penetration or damage reduction. Ignored here since Penetration above is already set (configuring
   # both is a warning; Penetration always wins).
   # Pierce_Entities: 2

   # Ricochet (list) - maxBounces-MATERIAL1,MATERIAL2-damageRetention
   Ricochet:
      - 3-STONE,COBBLESTONE,IRON_BLOCK-0.8
      - 2-CONCRETE-0.7

   # Tracer - RRGGBB-glowing-particleSize
   Tracer: FF5500-true-0.8

   # Armor Piercing - bypassPercentage (0.0-1.0)
   Armor_Piercing: 0.4

# Continuous HUD shown while this weapon is held (weapons-roadmap.md gate HD). All three keys below are optional.
# Action_Bar runs on the action bar's background channel, so it never locks out other plugins' background HUDs -
# a foreground message (a hook Action_Bar effect, the selective-fire cycle message, the charge meter) shows on
# top of it for its own ~2.5s window, then this HUD resumes underneath.
HUD:
   # Placeholders: %weapon% (display name, no ammo suffix), %ammo_left%/%ammo_max% (%ammo_max% shows "∞" when the
   # weapon has no magazine), %selective_fire% (current fire mode name, empty if the weapon has none),
   # %reload% (Reload.Action_Bar.Reloading while reloading, else empty), %durability% (current/max, empty when
   # unbreakable), %firearm_state% (reloading|scoping|empty|ready), %reload_progress% (0-100 while reloading,
   # else empty), %reload_stage%/%reload_stage_max% (1-based current stage / total stage count while reloading,
   # else empty - the Reload.Stages open/insert/close split above, gate HO).
   Action_Bar: "&6%weapon% &8«&e%ammo_left%&7/&e%ammo_max%&8» &7%selective_fire% %reload%"

   Boss_Bar:
      # Same placeholders as Action_Bar.
      Title: "&6%weapon% &7%ammo_left%/%ammo_max%"
      # org.bukkit.boss.BarColor. A bad value is a ConfigReport warning, falling back to WHITE.
      Color: YELLOW
      # org.bukkit.boss.BarStyle. A bad value is a ConfigReport warning, falling back to SOLID.
      Style: SEGMENTED_10

   # Shows the vanilla item-cooldown overlay (the diagonal sweep on the hotbar icon) for the whole reload duration.
   # The overlay is keyed by item Material, not by weapon - two weapons sharing a Material show each other's
   # reload overlay on the hotbar (firing is unaffected).
   Reload_Item_Cooldown: true

# Per-state custom model data / item model (weapons-roadmap.md gate HJ). Every key is optional - an absent state
# falls back to Default, then to Information.Custom_Model_Data/Item_Model above. The values below intentionally
# match Information.Custom_Model_Data so this block changes nothing about how the weapon looks out of the box;
# give each state its own resource-pack model to actually see the skins change.
Skins:
   Default: 1000
   Scope: 1000
   Reload: 1000
   Sprint: 1000
   No_Ammo: 1000

   # Named: player-selectable skins ("/bartizan weapon skin <name>"), each overriding any state above and/or
   # Item_Model. A state left out of a named skin falls back to that skin's own Default, then to the states
   # above.
   # Named:
   #    gold:
   #       Default: 2000
   #       Scope: 2001
   #       Item_Model: "bartizan:rifle_gold"

Death_Messages:
   - "&c%victim% was gunned down by %killer%'s %item%."
   - "&c%killer% landed a clean shot on %victim%."
   - "&c%victim% took a bullet from %killer%."