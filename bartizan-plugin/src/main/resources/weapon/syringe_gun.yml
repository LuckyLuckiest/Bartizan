# Old files without Charge:/Status:/Feedback: keep loading: Charge_Time_Per_Level/Max_Charge_Level are read as
# Shoot.Charge aliases, Cumulative_Levels defaults to false, and Status defaults to a minimal object named after
# the weapon with a boss bar and hit marker only (weapons-roadmap.md gate HB, §2.1). This file spells out the live
# keys so the comments double as the reference for every default.

Information:
   Name: "&aSyringe Gun"
   Category: biological
   Material: GLASS_BOTTLE
   Durability:
      Base: 100
      Change:
         On_Shot: 0
   Lore:
      - "&7Hold right-click to charge."
      - "&7Release to fire a single shot."
   Drop_Hologram: false

Shoot:
   Selective_Fire: single
   Allowed_Modes:
      - single
   Charge:
      Time_Per_Level: 20
      Max_Level: 3
      Min_Level_To_Fire: 1
      Auto_Fire_At_Max: false
   Range: 30.0
   Base_Damage: 4.0
   # Cumulative_Levels (default false): when true, releasing at level N applies every Effects_Per_Level entry from
   # 1..N merged (strongest amplifier, longest duration per potion type) instead of only level N's own entry — so
   # charging to level 3 doesn't silently drop the poison levels 1-2 would have applied.
   Cumulative_Levels: true
   Effects_Per_Level:
      - "POISON-60-1"
      - "POISON-100-1,SLOWNESS-80-1"
      - "WITHER-60-1,NAUSEA-100-1"
   # Status: the tracked infection a hit applies — this is what the victim/shooter see and what a killer-less
   # (poison/wither) death is credited against. Every key below is optional; the comment shows its default.
   Status:
      Name: "&2Infected"       # default: the weapon's display name
      Icon: "☣"                # default: "" (empty)
      Duration_Per_Level: 200  # ticks per level the status lasts, default 200
      Stacking: escalate       # refresh | extend | escalate | ignore, default refresh
      Max_Level: 3             # default: Shoot.Charge.Max_Level
      Kill_Credit_Window: 200  # ticks after the last hit a killer-less death still credits the shooter, default 200
      Contagion:
         Radius: 3.0           # blocks around the carrier a nearby player is rolled against, default 3.0
         Chance: 0.15          # per-Interval roll chance, default 0.15
         Interval: 40          # ticks between rolls, default 40
         Level_Drop: 1         # levels subtracted from the carrier's level on spread (floored at 1), default 1
      Cure:
         Items:
            - MILK_BUCKET      # default: [] (no item cures it)
         Wearable_Trait: sealed # worn-wearable trait that reduces the incoming level, default: none
   # Feedback: sugar lowered into Effects: On_Status_Apply/On_Status_Expire hooks (no-merge — a weapon's own
   # Effects: list for a hook always wins). Boss_Bar/Ambient_* are service-driven (ticked), never lowered into a
   # hook. With no Feedback: block at all, a default hit-marker sound is still lowered into On_Status_Apply.
   # Feedback.Victim.Title/Subtitle/Message_Expire and Feedback.Shooter.Action_Bar accept %status%/%icon% (baked in
   # at load time) and %shooter% (rewritten to %player% at load time, then resolved at fire time to the shooter's
   # name — empty on Message_Expire, since no shooter is known at expiry), plus the runtime %victim%/%weapon%/
   # %level% placeholders. Feedback.Shooter.Message_Spread is different: it is never lowered into an Effects: hook
   # (the contagion roll formats and sends it directly) and accepts only %victim%/%carrier%.
   Feedback:
      Victim:
         Title: "&2☣ INFECTED"                # lowered into On_Status_Apply's title (Target: victim)
         Subtitle: "&7by %shooter% · %weapon%" # %weapon% is the weapon's display name
         Boss_Bar:
            Text: "&2☣ %status% &7Lv %level% · %seconds%s" # default: "&f%icon% %status% &7Lv %level% · %seconds%s"
            Color: GREEN                                   # org.bukkit.boss.BarColor name, default WHITE
            Style: SEGMENTED_10                            # org.bukkit.boss.BarStyle name, default SOLID
         Ambient_Particle: DUST         # default: none (off); a Color-typed particle (e.g. ENTITY_EFFECT) also works
         Ambient_Color: "#3FA34D"       # DUST/Color-family particles only
         Ambient_Interval: 10           # ticks between ambient spawns, default 20
         Sound_Apply: ENTITY_ZOMBIE_VILLAGER_CURE     # played to the victim when the status (re)applies
         Sound_Expire: ENTITY_EXPERIENCE_ORB_PICKUP   # played to the victim when the status expires
         Message_Expire: "&aThe infection has passed." # chat line sent to the victim on expiry
      Shooter:
         Hit_Marker_Sound: ENTITY_EXPERIENCE_ORB_PICKUP           # played to the shooter on a landed hit
         Action_Bar: "&2☣ %victim% &7infected · Lv %level%"       # shown to the shooter on a landed hit
         Message_Spread: "&2☣ %victim% &7caught it from &2%carrier%" # chat line to the shooter on a contagion spread
   Recoil:
      Amount: 0.0
      Push: 0.04
      Power_Up: 0.0
      Pattern: []
   # Charge_Feedback: shared with beam weapons (gate HC). Tracer_Color additionally defaults Modifiers.Tracer when
   # the weapon declares no explicit tracer of its own, so the released shot draws a coloured line.
   Charge_Feedback:
      Sound_Level_Up: BLOCK_NOTE_BLOCK_PLING
      Pitch_Per_Level: 0.25
      Sound_Full: BLOCK_BEACON_ACTIVATE
      Tracer_Color: "#3FA34D"
   Sound:
      Default_Sound:
         Sound: ENTITY_ARROW_SHOOT
         Volume: 0.5
         Pitch: 1.5
      Empty_Default_Sound:
         Sound: ENTITY_BLAZE_BURN
         Volume: 0.6
         Pitch: 1.5

Ammunition:
   Ammo_Type: pathogen_vial
   # Number of syringes held
   Capacity: 3
   Consume: 1
   Restore: 3

Reload:
   Cooldown: 3
   Type: instant
   Sound:
      Default_Sound_Before:
         Sound: ITEM_BOTTLE_FILL
         Volume: 0.7
         Pitch: 1.0
      Default_Sound_After:
         Sound: ENTITY_EXPERIENCE_ORB_PICKUP
         Volume: 0.6
         Pitch: 1.0
   Action_Bar:
      Reloading: "&cReloading...&r"
      Opening: "&cOpening...&r"

Scope:
   Level: 1

Modifiers:
   Flat_Damage: 0.0

Death_Messages:
   - "&c%victim% was infected by %killer%'s %item%."
   - "&c%killer% injected %victim% with a lethal dose."
   - "&c%victim% succumbed to %killer%'s pathogen."
